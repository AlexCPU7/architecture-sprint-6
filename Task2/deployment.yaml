apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-test-app
  labels:
    app: scale-test-app
spec:
  selector:
    matchLabels:
      app: scale-test-app
  template:
    metadata:
      labels:
        app: scale-test-app
    spec:
      containers:
        - name: scale-test-app
          image: shestera/scaletestapp
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "15Mi"
            limits:
              memory: "30Mi"
